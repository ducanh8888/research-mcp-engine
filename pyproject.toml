[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "research-engine"
version = "0.1.0"
description = "Private MCP research retrieval, verification and evidence fusion engine"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==4.0.10", "mcp>=2.2,<3", "fastapi==0.142.2", "uvicorn==0.54.0",
  "sqlalchemy[asyncio]==2.1.3", "sqladmin==0.32.0", "httpx==0.28.1",
  "pydantic>=2.13,<3", "cryptography>=50,<51", "PyYAML>=6,<7",
  "bcrypt>=4,<6", "itsdangerous>=2,<3", "python-multipart>=0.0.22",
  "trafilatura>=2,<3", "pypdf>=6,<8", "feedparser>=6,<7",
  "beautifulsoup4>=4.13,<5", "rapidfuzz>=3,<4", "python-dotenv>=1,<2",
  "url-normalize>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "respx>=0.22,<1", "ruff>=0.13,<1"]
local-rerank = ["fastembed>=0.7,<1"]
postgres = ["psycopg[binary]>=3,<4"]
browser = ["playwright>=1.55,<2"]

[project.scripts]
research-engine = "research_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
