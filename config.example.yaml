# Run research-engine init to generate config.yaml and the referenced secret files.
# This file describes bootstrap settings; accounts and routes live in SQLite.
host: 127.0.0.1
port: 8765
data_dir: data
database_path: data/engine.db
blob_dir: data/blobs
encryption_key_file: data/encryption.key
admin_username: admin
# Replace with the password hash generated by research-engine init.
admin_password_hash: "<generated-password-hash>"
admin_session_secret_file: data/admin-session.key
# Example for this Docker deployment behind the existing HTTPS tunnel.
public_base_url: https://research.ducanh.cloud
trusted_origins:
  - https://research.ducanh.cloud
max_wait_s: 40
document_page_chars: 20000
max_response_bytes: 256000
